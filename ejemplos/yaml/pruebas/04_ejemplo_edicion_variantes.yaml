# Capítulo 4: mantenimiento y variantes (datos ficticios).
# Pensado para practicar la edición: una prueba completa, otra casi vacía,
# todos los valores de «automatizable», la clave antigua «imagen» (singular)
# que genera el importador y una sección sin pruebas a la que arrastrar
# elementos desde el árbol. Los comentarios como este se conservan al guardar.
capitulo: Ejemplo de edición y variantes
contenido:
- seccion: Modo inspección
  nivel: 2
  contexto:
  - El modo inspección permite mover la cabina a velocidad reducida desde la botonera de techo.
- prueba:
    nombre: Entrada en modo inspección
    nivel: 3
    id: DEMO-MANT-001
    titulo: El controlador entra en modo inspección y limita la velocidad
    descripcion: Activar el modo inspección y comprobar que la velocidad máxima baja a 0,25 m/s y se ignoran las llamadas.
    parametrizacion: []
    situacion_inicial:
    - La cabina está parada en P1 sin llamadas.
    - El técnico simulado está identificado en la HMI.
    pasos:
    - Activar el interruptor de inspección del techo de cabina.
    - texto: Comprobar el modo en la HMI.
      imagen: imagenes/pantalla_hmi.png
    - Mover la cabina hacia arriba con el pulsador de subida.
    - Registrar una llamada de piso en P3.
    - La HMI indica **INSPECCIÓN** y la velocidad no supera 0,25 m/s.
    - La llamada de P3 [[rojo|no]] se atiende mientras dure el modo.
    maniobra:
    - Simplex
    automatizable: corto
    entorno:
    - Torre
    requisitos:
    - REQ-MANT-001
    fecha: '2026-10-02'
    version: '1.0'
    etiquetas:
    - regresion
    - mantenimiento
    contexto:
    - El paso 2 usa la clave antigua «imagen» en lugar de «imagenes»; el editor la muestra igual.
    campos_adicionales:
      Personal: Técnico de mantenimiento (perfil simulado)
- prueba:
    nombre: Salida de inspección
    nivel: 3
    id: DEMO-MANT-002
    titulo: Al salir de inspección se recupera el servicio normal
    descripcion: Prueba a medio redactar, con campos opcionales vacíos, para practicar la edición.
    parametrizacion: []
    situacion_inicial: []
    pasos:
    - Desactivar el interruptor de inspección.
    maniobra: []
    automatizable: ''
    entorno: []
    requisitos: []
    etiquetas: []
    fecha: ''
    version: ''
- seccion: Variantes de formulario
  nivel: 2
  contexto:
  - Algunas tablas del documento original usan formularios distintos. Al importarlas, lo que no encaja en el esquema común se guarda en *campos adicionales*.
- prueba:
    nombre: Prueba de resistencia
    nivel: 3
    id: DEMO-VAR-001
    titulo: El controlador completa 1000 viajes sin errores
    descripcion: Prueba larga que procede de un formulario con campos de duración y ciclos.
    parametrizacion: []
    situacion_inicial:
    - Generador de tráfico configurado con llamadas aleatorias.
    pasos:
    - Lanzar el generador de tráfico.
    - Dejarlo funcionando hasta completar 1000 viajes.
    - Revisar el registro de eventos.
    - No hay alarmas de tipo E en el registro.
    maniobra: []
    automatizable: largo
    entorno:
    - Automático
    requisitos:
    - REQ-RES-001
    fecha: '2026-10-05'
    version: '1.0'
    etiquetas:
    - resistencia
    campos_adicionales:
      Duración estimada: 8 h
      Ciclos: '1000'
      Criterio de aceptación: |-
        Cero alarmas de tipo E.
        Como máximo 5 avisos de tipo W.
- prueba:
    nombre: Rescate manual
    nivel: 3
    id: DEMO-VAR-002
    titulo: El procedimiento de rescate manual lleva la cabina a planta
    descripcion: Variante redactada por otro equipo, con campos adicionales propios.
    parametrizacion: []
    situacion_inicial:
    - Corte de alimentación simulado con la cabina entre P1 y P2.
    pasos:
    - Activar el freno manual desde el cuadro de rescate.
    - Mover la cabina hasta la zona de puertas de P1.
    - La cabina queda en zona de puertas.
    maniobra: []
    automatizable: no
    entorno:
    - Torre
    requisitos:
    - REQ-RES-002
    fecha: '2026-10-05'
    version: '0.9'
    etiquetas:
    - seguridad
    - manual
    campos_adicionales:
      Equipo autor: Equipo de seguridad (ficticio)
- seccion: Para practicar
  nivel: 2
  contexto:
  - Sección vacía. Arrastra aquí pruebas desde el árbol, crea subsecciones o bórrala; sus niveles se ajustan solos.
