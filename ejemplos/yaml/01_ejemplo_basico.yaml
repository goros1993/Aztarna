# Capítulo 1: llamadas y desplazamientos (datos ficticios).
# Muestra lo esencial: texto de capítulo, secciones en dos niveles, pruebas
# con listas sencillas, subpuntos con «nivel» y una imagen en un paso, y
# los campos de la tabla común (parametrización, maniobra, entorno de pruebas
# con varias opciones, requisitos y tags).
# Empieza con una tabla que no es una prueba (historial de cambios).
capitulo: Ejemplo básico
contenido:
- tabla:
    filas:
    - ['**Modificado por**', '**Fecha**', '**Edición**', '**Cambio**']
    - [Ana Pérez, 12/01/2026, '1.0', Primera versión del capítulo.]
    - [Luis Gómez, 03/03/2026, '1.1', Añadida la prueba de nivelación DEMO-NIV-001.]
- texto: >-
    Este capítulo reúne las pruebas **funcionales básicas** del controlador
    DEMO-A1: registro de llamadas, servicio de plantas y nivelación. Todas se
    ejecutan sobre el banco HIL con la instalación simulada de cuatro paradas.
  alcance: capitulo
- seccion: Llamadas
  nivel: 2
  contexto:
  - La instalación simulada tiene cuatro paradas (PB, P1, P2 y P3) y una sola cabina.
  - texto: Esquema del pozo con los sensores de nivel de cada planta.
    imagenes:
    - imagenes/esquema_pozo.png
- prueba:
    nombre: Llamada desde cabina
    nivel: 3
    id: DEMO-LLAM-001
    titulo: Una llamada de cabina lleva el ascensor a la planta pedida
    descripcion: Comprobar que una llamada registrada desde la botonera de cabina se atiende y la cabina se detiene en la planta seleccionada.
    parametrizacion:
    - 'Número de paradas: 4 (PB a P3).'
    - Llamadas de cabina habilitadas en todas las plantas.
    situacion_inicial:
    - La cabina está parada en PB con las puertas cerradas.
    - No hay llamadas pendientes.
    pasos:
    - texto: Pulsar el botón **2** de la botonera de cabina.
      imagenes:
      - imagenes/botonera_cabina.png
    - Comprobar que el botón se ilumina y el indicador muestra *▲ 2*.
    - Esperar a que la cabina llegue a P2.
    - La cabina se detiene en P2 y abre puertas.
    - La llamada se borra del registro y el botón se apaga.
    maniobra:
    - Simplex
    - Dúplex
    automatizable: si
    entorno:
    - Automático
    - Maqueta
    requisitos:
    - REQ-LLAM-001
    fecha: '2026-09-15'
    version: '1.2'
    etiquetas:
    - smoke
    - regresion
    - llamadas
- prueba:
    nombre: Llamada desde piso
    nivel: 3
    id: DEMO-LLAM-002
    titulo: Una llamada de piso queda registrada y se confirma al pasajero
    descripcion: Verificar que una llamada desde el pulsador de piso se registra y se confirma con la luz del pulsador.
    parametrizacion: []
    situacion_inicial:
    - La cabina está parada en P3.
    pasos:
    - Pulsar la llamada de subida en P1.
    - Observar el pulsador de P1.
    - El pulsador de P1 queda iluminado hasta que la cabina llega.
    maniobra:
    - Simplex
    automatizable: no
    entorno:
    - Automático
    requisitos:
    - REQ-LLAM-002
    fecha: '2026-09-15'
    version: '1.0'
    etiquetas:
    - regresion
    - llamadas
- seccion: Llamadas simultáneas
  nivel: 3
  contexto:
  - Pruebas con varias llamadas activas a la vez para comprobar el orden de servicio.
- prueba:
    nombre: Orden de servicio con llamadas cruzadas
    nivel: 4
    id: DEMO-LLAM-003
    titulo: Las llamadas se atienden en el sentido de marcha
    descripcion: Con la cabina subiendo, las llamadas en el mismo sentido se atienden antes que las de sentido contrario.
    parametrizacion: []
    situacion_inicial:
    - La cabina está en PB y sale hacia P3 por una llamada de cabina.
    pasos:
    - 'Mientras sube, registrar estas llamadas de piso:'
    - texto: P1 de bajada.
      nivel: 1
    - texto: P2 de subida.
      nivel: 1
    - Anotar el orden en que la cabina se detiene.
    - 'La cabina se detiene en este orden:'
    - texto: P2 (subida), porque va en el sentido de marcha.
      nivel: 1
    - texto: P3 (destino de cabina).
      nivel: 1
    - texto: P1 (bajada), en el viaje de vuelta.
      nivel: 1
    maniobra:
    - Simplex
    - Dúplex
    automatizable: si
    entorno:
    - Maqueta
    requisitos:
    - REQ-LLAM-003
    - REQ-COLA-001
    fecha: '2026-09-20'
    version: '1.0'
    etiquetas:
    - regresion
    - llamadas
- seccion: Nivelación
  nivel: 2
- prueba:
    nombre: Precisión de parada
    nivel: 3
    id: DEMO-NIV-001
    titulo: La cabina para dentro de la tolerancia de nivelación
    descripcion: Medir el desnivel entre el suelo de cabina y el de planta tras una parada normal.
    parametrizacion:
    - 'Tolerancia de nivelación: ±5 mm.'
    situacion_inicial:
    - Carga en cabina simulada al 0 %.
    pasos:
    - Enviar la cabina de PB a P3.
    - Leer el desnivel informado por el sensor de nivel de P3.
    - Repetir con carga simulada al 100 %.
    - El desnivel es menor de [[res:amarillo|±5 mm]] en ambos casos.
    maniobra:
    - Dúplex
    automatizable: si
    entorno:
    - Automático
    - Torre
    requisitos:
    - REQ-NIV-001
    fecha: '2026-09-22'
    version: '1.1'
    etiquetas:
    - smoke
    - regresion
