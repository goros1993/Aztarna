- prueba:
    nombre: Pérdida de comunicación
    nivel: 3
    id: DEMO-CAN-002
    titulo: El controlador detecta la pérdida del bus y para en planta
    descripcion: Simular la desconexión del bus CAN durante un viaje.
    parametrizacion: []
    situacion_inicial:
    - La cabina viaja de PB a P3.
    pasos:
    - Desconectar el bus CAN desde el panel del banco HIL.
    - Esperar al menos 1 s.
    - Se genera la alarma [[rojo|E-210 Comunicación perdida]].
    - La cabina para en la siguiente planta y abre puertas.
    maniobra:
    - Simplex
    - Dúplex
    automatizable: medio
    entorno:
    - Maqueta
    - Torre
    requisitos:
    - REQ-CAN-020
    fecha: '2026-09-18'
    version: '1.0'
    etiquetas:
    - regresion
    - comunicaciones
    - seguridad
    campos_adicionales:
      Tiempo máximo de detección: 500 ms
      Datos de prueba:
      - 'Bus: CAN1 a 250 kbit/s'
      - 'Desconexión: física, desde el relé R4 del banco'
